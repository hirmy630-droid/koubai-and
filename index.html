    <style>
        /* iOS Dark Mode Theme */
        body {
            background-color: #000000;
            color: #ffffff;
            font-size: 0.9375rem; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* 一体型コンテナ */
        .unified-input-unit {
            background: #1c1c1e;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #333;
        }

        /* 入力セルセクション */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #000;
        }
        .input-cell {
            border-bottom: 1px solid #333;
            border-right: 1px solid #333;
            padding: 4px 10px;
            height: 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: #000;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }
        .input-cell:nth-child(2n) {
            border-right: none;
        }
        .input-cell.active {
            outline: 2px solid #ff9f0a;
            outline-offset: -2px;
            z-index: 20;
            background: #1c1c1e;
        }
        .cell-label {
            font-size: 13px !important;
            font-weight: 600;
            margin-bottom: 0px;
        }
        .cell-value {
            font-size: 1.55rem; 
            font-weight: 700;
            text-align: right;
            padding-right: 4px;
            line-height: 1.1;
        }

        /* 2行構成のテンキーエリア（隙間ゼロの一体型） */
        .keypad-container {
            padding: 0;
            background: #151517;
            display: flex;
            flex-direction: column;
            gap: 0;
            border-top: 1px solid #333;
        }

        .keypad-row-1 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0;
            border-bottom: 1px solid #333;
        }

        .keypad-row-2 {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 0;
        }

        /* 立体的なキーボタン（高さ54px） */
        .key-btn {
            background: #242426;
            color: #ffffff;
            height: 54px;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.38rem;
            font-weight: 600;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            cursor: pointer;
            position: relative;
            border-right: 1px solid #333;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), inset 0 -2px 0 rgba(0, 0, 0, 0.35);
            transition: background-color 0.06s ease;
        }

        .keypad-row-1 .key-btn:last-child,
        .keypad-row-2 .key-btn:last-child {
            border-right: none;
        }

        /* 押下時の立体的な沈み込み */
        .key-btn:active {
            background: #18181a;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* 1行目コントロールキー (AC, C) */
        .key-btn.gray-control {
            background: #353538;
            color: #e5e5ea;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 -2px 0 rgba(0, 0, 0, 0.4);
        }
        .key-btn.gray-control:active {
            background: #28282b;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        /* 2行目数字キーの微調整 (9分割で収まるように文字サイズ最適化) */
        .keypad-row-2 .key-btn {
            font-size: 1.32rem;
            padding: 0;
        }

        .result-label {
            font-size: 13px !important;
            font-weight: 700;
        }

        .result-value {
            font-size: 1.55rem;
            font-weight: 800;
            line-height: 1.1;
        }

        .canvas-container {
            background-color: #000;
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
        }
        canvas { width: 100%; height: 100%; display: block; }

        .view-section { display: none; }
        .view-section.active { display: block; }
        
        /* 寸法詳細テーブルの行幅（上下パディングをコンパクトに縮小） */
        .result-table th {
            border: 0.5px solid #333; 
            text-align: center; 
            padding: 6px 2px !important;
            font-size: 13px;
        }
        
        .result-table td {
            border: 0.5px solid #333; 
            text-align: center; 
            padding: 6px 2px !important;
            font-size: 1.05rem;
        }

        #installBtn {
            position: fixed;
            right: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom));
            z-index: 9999;
            border: none;
            border-radius: 14px;
            background: #2563eb;
            color: #fff;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 10px 24px rgba(0,0,0,.35);
            display: none;
        }
        #installBtn:active { transform: scale(.98); }
    </style>

    <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
      window.addEventListener('load', () => {
        // バージョンパラメータを更新
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            if (!installingWorker) return;
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                installingWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            };
          };
        }).catch(() => {});

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            window.location.reload();
            refreshing = true;
          }
        });
      });
    }

<body class="p-3 relative">
    <div id="app-container" class="max-w-md mx-auto min-h-screen pb-4">
        <header class="flex items-center justify-between py-1 px-1 mb-2">
            <h1 class="text-[20px] font-bold text-white tracking-tight">勾配 寸法計算</h1>
            <button id="screenToggleBtn" type="button" onclick="toggleScreen()" class="bg-[#2c2c2e] hover:bg-[#3a3a3c] text-[#ff9f0a] border border-[#ff9f0a]/60 text-[13px] font-bold px-3 py-1.5 rounded-lg active:scale-95 transition-all flex items-center gap-1 shadow-sm">
                <span id="screenToggleText">寸法表</span>
                <svg id="screenToggleIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </header>

        <!-- 計算画面 -->
        <div id="view-calc" class="view-section active">
            <div class="unified-input-unit mb-3">
                <div class="input-grid">
                    <div id="cell-L1" class="input-cell active" onclick="setActiveCell('L1')">
                        <span class="cell-label text-[#30d158]">最短 L1</span>
                        <span id="val-L1" class="cell-value text-[#30d158]">0</span>
                    </div>
                    <div id="cell-L2" class="input-cell" onclick="setActiveCell('L2')">
                        <span class="cell-label text-[#30d158]">最長 L2</span>
                        <span id="val-L2" class="cell-value text-[#30d158]">0</span>
                    </div>
                    <div id="cell-W" class="input-cell" onclick="setActiveCell('W')">
                        <span class="cell-label text-[#0a84ff]">全体の幅 W</span>
                        <span id="val-W" class="cell-value text-[#0a84ff]">0</span>
                    </div>
                    <div id="cell-Pitch" class="input-cell" onclick="setActiveCell('Pitch')">
                        <span class="cell-label text-[#bf5af2]">働き幅 ＠</span>
                        <span id="val-Pitch" class="cell-value text-[#bf5af2]">0</span>
                    </div>
                </div>

                <!-- 2行構成の立体テンキー -->
                <div class="keypad-container">
                    <!-- 1行目: AC / 00 / 0 / ⏎ / C -->
                    <div class="keypad-row-1">
                        <div class="key-btn gray-control text-[1.22rem]" onclick="pressKey('AC')">AC</div>
                        <div class="key-btn text-[1.28rem]" onclick="pressKey('00')">00</div>
                        <div class="key-btn text-[1.38rem]" onclick="pressKey('0')">0</div>
                        <!-- ⏎キー: ボタン背景は0キーと同じ、マークのみオレンジ色を維持 -->
                        <div class="key-btn text-[#ff9f0a] text-[1.48rem]" onclick="pressKey('enter')">⏎</div>
                        <div class="key-btn gray-control text-[1.28rem]" onclick="pressKey('C')">C</div>
                    </div>

                    <!-- 2行目: 1 〜 9 -->
                    <div class="keypad-row-2">
                        <div class="key-btn" onclick="pressKey('1')">1</div>
                        <div class="key-btn" onclick="pressKey('2')">2</div>
                        <div class="key-btn" onclick="pressKey('3')">3</div>
                        <div class="key-btn" onclick="pressKey('4')">4</div>
                        <div class="key-btn" onclick="pressKey('5')">5</div>
                        <div class="key-btn" onclick="pressKey('6')">6</div>
                        <div class="key-btn" onclick="pressKey('7')">7</div>
                        <div class="key-btn" onclick="pressKey('8')">8</div>
                        <div class="key-btn" onclick="pressKey('9')">9</div>
                    </div>
                </div>
            </div>

            <!-- 計算結果サマリー表示 -->
            <div class="bg-[#1c1c1e] rounded-[14px] p-3 border border-[#333]">
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <div class="bg-black border border-[#333] p-1.5 rounded-lg text-center">
                        <span class="block result-label text-[#0a84ff]">延長後の幅</span>
                        <span id="resNewB" class="result-value text-white">-</span>
                    </div>
                    <div class="bg-black border border-[#333] p-1.5 rounded-lg text-center">
                        <span class="block result-label text-[#30d158]">延長後のL2</span>
                        <span id="resNewC" class="result-value text-white">-</span>
                    </div>
                    <div class="bg-black border border-[#333] p-1.5 rounded-lg text-center">
                        <span class="block result-label text-[#ff9f0a]">総枚数</span>
                        <span id="resIntervalCount" class="result-value text-white">-</span>
                    </div>
                    <div class="bg-black border border-[#333] p-1.5 rounded-lg text-center">
                        <span class="block result-label text-[#bf5af2]">増分</span>
                        <span id="resStep" class="result-value text-white">-</span>
                    </div>
                </div>
                
                <div class="canvas-container border border-[#333] rounded-lg cursor-pointer" onclick="openZoomModal()">
                    <canvas id="slopeCanvas"></canvas>
                </div>
            </div>
        </div>

        <!-- 寸法表画面 -->
        <div id="view-table" class="view-section">
            <div class="bg-[#1c1c1e] rounded-[14px] p-3 border border-[#333]">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-gray-200">寸法詳細</h2>
                    <span id="table-summary" class="text-lg text-[#ff9f0a] font-bold"></span>
                </div>
                <table class="result-table w-full border-collapse bg-black text-sm">
                    <thead>
                        <tr>
                            <th class="w-[20%] text-[#ff9f0a] bg-[#1c1c1e]" style="border-bottom: 1px solid #d1d1d6;">No.</th>
                            <th class="w-[40%] text-[#0a84ff] bg-[#1c1c1e]" style="border-bottom: 1px solid #d1d1d6;">働き幅</th>
                            <th class="w-[40%] text-[#30d158] bg-[#1c1c1e]" style="border-bottom: 1px solid #d1d1d6;">長さ</th>
                        </tr>
                    </thead>
                    <tbody id="resultBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 拡大・ピンチ・回転対応ズームモーダル -->
    <div id="zoomModal" class="hidden fixed inset-0 z-[10000] flex flex-col bg-black transition-opacity">
        <div class="absolute top-0 left-0 right-0 p-4 md:p-6 flex justify-end items-center z-[10010]">
            <div class="flex gap-3">
                <button type="button" class="text-white bg-white/20 hover:bg-white/30 rounded-full p-2.5 backdrop-blur-md transition-colors" onclick="toggleZoomRotation()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                </button>
                <button type="button" class="text-white bg-white/20 hover:bg-white/30 rounded-full p-2.5 backdrop-blur-md transition-colors" onclick="closeZoomModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
        </div>
        <div id="zoomArea" class="flex-1 w-full h-full flex items-center justify-center overflow-hidden touch-none relative">
            <img id="zoomImg" class="max-w-full max-h-full object-contain transition-transform duration-75 ease-out" alt="拡大図面" style="transform-origin: center;">
        </div>
    </div>

    <script>
        let currentTab = 'calc';
        let activeKey = 'L1';
        let values = { L1: '0', L2: '0', W: '0', Pitch: '0' };
        let isFirstInput = true;
        let confirmedDrawing = null;
        const sequence = ['L1', 'L2', 'W', 'Pitch'];
        let touchStartX = 0;
        let touchStartY = 0;

        // ---------- 入力・計算系 ----------
        function setActiveCell(key) {
            activeKey = key;
            isFirstInput = true; 
            sequence.forEach(k => {
                const cell = document.getElementById(`cell-${k}`);
                if(cell) cell.classList.remove('active');
            });
            const activeCell = document.getElementById(`cell-${key}`);
            if(activeCell) activeCell.classList.add('active');
        }

        function pressKey(key) {
            let cur = values[activeKey];
            if (key === 'AC') {
                values = { L1: '0', L2: '0', W: '0', Pitch: '0' };
                isFirstInput = true;
            } else if (key === 'C') {
                values[activeKey] = '0';
                isFirstInput = true;
            } else if (key === 'enter') {
                calculate(true);
                const idx = sequence.indexOf(activeKey);
                const nextIdx = (idx + 1) % sequence.length;
                setActiveCell(sequence[nextIdx]);
                return;
            } else {
                if (isFirstInput) {
                    if (key === '00') values[activeKey] = '0';
                    else values[activeKey] = key;
                    isFirstInput = false;
                } else {
                    if (cur === '0') {
                        if (key !== '00') values[activeKey] = key;
                    } else {
                        values[activeKey] += key;
                    }
                }
            }
            updateDisplay();
            clearDrawing();
            calculate();
            saveState();
        }

        function updateDisplay() {
            sequence.forEach(k => {
                const val = values[k];
                const num = parseFloat(val);
                const display = document.getElementById(`val-${k}`);
                if(display) display.innerText = isNaN(num) ? val : num.toLocaleString('en-US', {maximumFractionDigits: 4});
            });
        }

        function toggleScreen() {
            switchTab(currentTab === 'calc' ? 'table' : 'calc');
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            const targetView = document.getElementById(`view-${tabName}`);
            if(targetView) targetView.classList.add('active');

            const btnText = document.getElementById('screenToggleText');
            const btnIcon = document.getElementById('screenToggleIcon');
            if (btnText && btnIcon) {
                if (tabName === 'calc') {
                    btnText.innerText = '寸法表';
                    btnIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />';
                } else {
                    btnText.innerText = '計算へ戻る';
                    btnIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />';
                }
            }

            if (tabName === 'calc' && confirmedDrawing) drawSlope(...confirmedDrawing);
            window.scrollTo(0, 0);
        }

        function clearDrawing() {
            confirmedDrawing = null;
            const canvas = document.getElementById('slopeCanvas');
            if (canvas) canvas.width = 0;
            closeZoomModal();
        }

        function calculate(draw = false) {

            const a = parseFloat(values.L1) || 0;
            const b = parseFloat(values.W) || 0;
            const c = parseFloat(values.L2) || 0;
            const interval = parseFloat(values.Pitch) || 0;

            const count = Math.ceil(b / interval);
            let error = '';
            if (![a, b, c, interval].every(Number.isFinite) ||
                [a, b, c, interval].some(n => n < 0)) {
                error = '入力値を確認してください';
            } else if (c < a) {
                error = '最長L2は最短L1以上にしてください';
            } else if (b > 0 && interval > 0 && (!Number.isSafeInteger(count) || count > 1000)) {
                error = '総枚数は1000枚以内にしてください';
            } else if (b > 0 && interval > 0 &&
                ![count * interval, (c - a) / b, a + ((c - a) / b) * (count * interval)].every(Number.isFinite)) {
                error = '入力値が大きすぎます';
            }
            if (error || b <= 0 || interval <= 0) {
                ['resNewB', 'resNewC', 'resIntervalCount', 'resStep'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.innerText = '-';
                });
                const tbody = document.getElementById('resultBody');
                if (tbody) tbody.innerHTML = '';
                const summary = document.getElementById('table-summary');
                if (summary) summary.innerText = error;
                clearDrawing();
                return;
            }

            const newB = count * interval;
            const slope = (c - a) / b;
            const newC = a + (slope * newB);
            const step = slope * interval;

            const resNewB = document.getElementById('resNewB');
            const resNewC = document.getElementById('resNewC');
            const resIntervalCount = document.getElementById('resIntervalCount');
            const resStep = document.getElementById('resStep');
            const tableSummary = document.getElementById('table-summary');

            if(resNewB) resNewB.innerText = Math.round(newB).toLocaleString();
            if(resNewC) resNewC.innerText = Math.round(newC).toLocaleString();
            if(resIntervalCount) resIntervalCount.innerText = count;
            if(resStep) resStep.innerText = Math.round(Math.abs(step)).toLocaleString();
            if(tableSummary) tableSummary.innerText = `${count}枚`;

            const tbody = document.getElementById('resultBody');
            if(tbody) {
                tbody.innerHTML = '';
                for (let i = 0; i <= count; i++) {
                    const dist = i * interval;
                    const height = a + (slope * dist);
                    const tr = document.createElement('tr');
                    
                    const distColor = i === 0 ? "text-[#8e8e93]" : "text-[#0a84ff]";
                    const heightColor = i === 0 ? "text-[#8e8e93]" : "text-[#30d158]";
                    
                    tr.innerHTML = `
                        <td class="text-[#ff9f0a] font-bold">${i}</td>
                        <td class="${distColor}">${dist.toLocaleString()}</td>
                        <td class="${heightColor} font-black text-lg">${Math.round(height).toLocaleString()}</td>
                    `;
                    tbody.appendChild(tr);
                }

                const scrapW = newB - b;
                const scrapL = newC - c;
                
                const trScrap = document.createElement('tr');
                trScrap.className = "bg-[#2c2c2e]";
                trScrap.innerHTML = `
                    <td class="text-[#d1d1d6] font-bold text-[13px]" style="border-top: 1px solid #d1d1d6;">端材</td>
                    <td class="text-[#0a84ff]" style="border-top: 1px solid #d1d1d6;">
                        <div class="flex flex-col items-center justify-center">
                            <span class="text-[12px] text-[#d1d1d6] font-normal leading-tight">働き 端材</span>
                            <span class="leading-tight font-semibold mt-0.5">${Math.round(scrapW).toLocaleString()}</span>
                        </div>
                    </td>
                    <td class="text-[#30d158] font-black text-lg" style="border-top: 1px solid #d1d1d6;">
                        <div class="flex flex-col items-center justify-center">
                            <span class="text-[12px] text-[#d1d1d6] font-normal leading-tight">長さ 端材</span>
                            <span class="leading-tight mt-0.5">${Math.round(scrapL).toLocaleString()}</span>
                        </div>
                    </td>
                `;
                tbody.appendChild(trScrap);
            }
            if (draw) {
                confirmedDrawing = [a, b, c, newB, newC, count, interval];
                drawSlope(...confirmedDrawing);
            }
        }

        function drawSlope(a, origB, origC, newB, newC, count, interval) {
            const canvas = document.getElementById('slopeCanvas');
            if(!canvas) return;
            const container = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, rect.width, rect.height);
            
            const padding = { l: 30, r: 30, t: 35, b: 35 };
            const drawW = rect.width - (padding.l + padding.r);
            const drawH = rect.height - (padding.t + padding.b);
            const scaleX = drawW / (newB || 1);
            const maxHeight = Math.max(a, newC, origC);
            const scaleY = drawH / (maxHeight || 1);

            const tx = (x) => padding.l + x * scaleX;
            const ty = (y) => rect.height - padding.b - y * scaleY;

            ctx.beginPath(); ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
            for (let grid = 1; grid <= 4; grid++) {
                const j = maxHeight * grid / 4;
                ctx.moveTo(tx(0), ty(j)); ctx.lineTo(tx(newB), ty(j));
            }
            ctx.stroke();

            ctx.beginPath(); ctx.strokeStyle = '#0a84ff'; ctx.lineWidth = 2;
            ctx.moveTo(tx(0), ty(0)); ctx.lineTo(tx(newB), ty(0)); ctx.stroke();

            for (let i = 1; i < count; i++) {
                const cx = i * interval;
                const cy = a + ((newC - a) / newB) * cx;
                ctx.beginPath();
                ctx.strokeStyle = '#bf5af2';
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.5;
                ctx.moveTo(tx(cx), ty(0)); ctx.lineTo(tx(cx), ty(cy)); ctx.stroke();
                ctx.globalAlpha = 1.0;
            }

            if (origB > 0 && origB !== newB) {
                ctx.setLineDash([4, 2]); ctx.strokeStyle = '#ff453a'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(tx(origB), ty(0)); ctx.lineTo(tx(origB), ty(origC)); ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.font = "bold 11px sans-serif"; 
                ctx.fillStyle = "#ff453a";
                ctx.textAlign = "center";
                ctx.fillText(Math.round(origC), tx(origB), ty(0) + 16);
            }

            ctx.beginPath(); ctx.strokeStyle = '#30d158'; ctx.lineWidth = 2;
            ctx.moveTo(tx(0), ty(0)); ctx.lineTo(tx(0), ty(a)); ctx.stroke();

            ctx.beginPath(); ctx.strokeStyle = '#30d158'; ctx.lineWidth = 2;
            ctx.moveTo(tx(newB), ty(0)); ctx.lineTo(tx(newB), ty(newC)); ctx.stroke();

            ctx.beginPath(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
            ctx.moveTo(tx(0), ty(a)); ctx.lineTo(tx(newB), ty(newC)); ctx.stroke();
            
            ctx.font = "bold 11px sans-serif"; 
            ctx.fillStyle = "#30d158"; 
            ctx.textAlign = "center";
            ctx.fillText(Math.round(a), tx(0), ty(a) - 8);
            ctx.fillText(Math.round(newC), tx(newB), ty(newC) - 8);

            ctx.fillStyle = "#0a84ff";
            ctx.fillText(`W: ${Math.round(origB)}`, tx(origB / 2), ty(0) + 16);

            if (origB !== newB && newB > 0) {
                ctx.fillStyle = "#8e8e93";
                ctx.font = "bold 10px sans-serif"; 
                ctx.fillText(`全体幅: ${Math.round(newB)}`, tx(newB / 2), ty(0) + 28);
            }
        }

        function saveState() {
            try {
                localStorage.setItem('slope_calc_v_keypad', JSON.stringify(values));
            } catch(e) {}
        }

        let zoomState = { scale: 1, x: 0, y: 0, rotation: 0 };
        let pinchState = { isDragging: false, startX: 0, startY: 0, initialDist: 0, initialScale: 1 };

        function openZoomModal() {
            const canvas = document.getElementById('slopeCanvas');
            if (!canvas || canvas.width === 0) return;

            const zoomImg = document.getElementById('zoomImg');
            zoomImg.src = canvas.toDataURL('image/png');
            
            zoomState = { scale: 1, x: 0, y: 0, rotation: 0 };
            updateZoomTransform();

            const modal = document.getElementById('zoomModal');
            modal.classList.remove('hidden');
        }

        function closeZoomModal() {
            const modal = document.getElementById('zoomModal');
            modal.classList.add('hidden');
            const zoomImg = document.getElementById('zoomImg');
            zoomImg.src = '';
        }

        function toggleZoomRotation() {
            const zoomImg = document.getElementById('zoomImg');
            zoomState.rotation = (zoomState.rotation === 0) ? 90 : 0;
            zoomState.x = 0;
            zoomState.y = 0;
            
            if (zoomState.rotation === 90) {
                const vW = window.innerWidth;
                const vH = window.innerHeight;
                const rect = zoomImg.getBoundingClientRect();
                const scaleW = (vW * 0.95) / (rect.height || 1);
                const scaleH = (vH * 0.95) / (rect.width || 1);
                zoomState.scale = Math.min(scaleW, scaleH);
            } else {
                zoomState.scale = 1;
            }
            
            zoomImg.style.transition = 'transform 0.3s ease-in-out';
            updateZoomTransform();
            setTimeout(() => { zoomImg.style.transition = 'none'; }, 300);
        }

        function updateZoomTransform() {
            const zoomImg = document.getElementById('zoomImg');
            zoomImg.style.transform = `translate(${zoomState.x}px, ${zoomState.y}px) scale(${zoomState.scale}) rotate(${zoomState.rotation}deg)`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const zoomArea = document.getElementById('zoomArea');
            if (!zoomArea) return;

            zoomArea.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    pinchState.isDragging = true;
                    pinchState.startX = e.touches[0].clientX - zoomState.x;
                    pinchState.startY = e.touches[0].clientY - zoomState.y;
                } else if (e.touches.length === 2) {
                    pinchState.isDragging = false;
                    pinchState.initialDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    pinchState.initialScale = zoomState.scale;
                }
            }, { passive: false });

            zoomArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1 && pinchState.isDragging) {
                    zoomState.x = e.touches[0].clientX - pinchState.startX;
                    zoomState.y = e.touches[0].clientY - pinchState.startY;
                    updateZoomTransform();
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const scale = pinchState.initialScale * (dist / (pinchState.initialDist || 1));
                    zoomState.scale = Math.max(0.3, Math.min(scale, 10));
                    updateZoomTransform();
                }
            }, { passive: false });

            zoomArea.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    pinchState.initialDist = 0;
                }
                if (e.touches.length === 0) {
                    pinchState.isDragging = false;
                } else if (e.touches.length === 1) {
                    pinchState.isDragging = true;
                    pinchState.startX = e.touches[0].clientX - zoomState.x;
                    pinchState.startY = e.touches[0].clientY - zoomState.y;
                }
            });
        });

        function handleTouchStart(e) {
            if (e.target.closest('.keypad-container')) {
                touchStartX = 0;
                touchStartY = 0;
                return;
            }
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }

        function handleTouchEnd(e) {
            if (touchStartX === 0 && touchStartY === 0) return;
            if (!document.getElementById('zoomModal').classList.contains('hidden')) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const diffX = touchStartX - touchEndX;
            const diffY = touchStartY - touchEndY;

            touchStartX = 0;
            touchStartY = 0;

            if (Math.abs(diffY) < 60 && Math.abs(diffX) > 80) {
                if (diffX > 0) switchTab('table');
                else switchTab('calc');
            }
        }

        window.onload = () => {
            try {
                const saved = JSON.parse(localStorage.getItem('slope_calc_v_keypad'));
                if (saved && typeof saved === 'object' && !Array.isArray(saved) &&
                    sequence.every(k => typeof saved[k] === 'string' &&
                        /^\d+(?:\.\d+)?$/.test(saved[k]) &&
                        Number.isFinite(Number(saved[k])))) {
                    values = Object.fromEntries(sequence.map(k => [k, saved[k]]));
                }
            } catch (error) {
                // 破損データや保存領域の利用制限があっても起動する。
            }
            updateDisplay();
            calculate();
            clearDrawing();
            window.addEventListener('touchstart', handleTouchStart, {passive: true});
            window.addEventListener('touchend', handleTouchEnd, {passive: true});
            window.addEventListener('resize', () => {
                if (confirmedDrawing && currentTab === 'calc') drawSlope(...confirmedDrawing);
            });
        };
    </script>

    <button id="installBtn" aria-label="このアプリをインストール">アプリをインストール</button>
    <script>
    (function() {
      let deferredPrompt = null;
      const btn = document.getElementById('installBtn');
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        if (!isStandalone) btn.style.display = 'block';
      });

      btn.addEventListener('click', async function() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        try { await deferredPrompt.userChoice; } catch (e) {}
        deferredPrompt = null;
        btn.style.display = 'none';
      });

      window.addEventListener('appinstalled', function() {
        btn.style.display = 'none';
      });
    })();
    </script>
</body>
